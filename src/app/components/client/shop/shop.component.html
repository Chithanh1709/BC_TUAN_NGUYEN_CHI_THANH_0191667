<p-toast></p-toast>

<section class="breadcrumb-section set-bg" [ngStyle]="{backgroundImage:'url(assets/image/breadcrumb.jpg'}">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <div class="breadcrumb__text">
                    <h2>Danh mục sản phẩm</h2>
                    <div class="breadcrumb__option">
                        <a routerLink="/" >Trang chủ</a>
                        <span>Danh mục</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="product spad">
    <div class="container">
        <div class="row">
            <div class="col-lg-3 col-md-5">
                <div class="sidebar">
                    <!-- Danh mục sản phẩm -->
                    <div class="sidebar__item">
                        <h4>Danh mục sản phẩm</h4>
                        <ul>
                            <li>
                                <a routerLink="/category/{{category.id}}" 
                                   *ngFor="let category of listCategory">
                                    {{category.name}}
                                </a>
                            </li>
                        </ul>
                    </div>

                    <!-- Mức giá với checkbox -->
                    <div class="sidebar__item">
                        <h4>Mức giá</h4>
                        <div class="price-checkbox-group">
                            <div class="price-checkbox-item" *ngFor="let range of priceRanges">
                                <label class="custom-checkbox">
                                    <input type="checkbox" 
                                           [(ngModel)]="range.checked"
                                           (change)="onPriceRangeChange()">
                                    <span class="checkmark"></span>
                                    <span class="label-text">{{range.label}}</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-9 col-md-7">
                <div class="row">
                    <p-dataView [value]="listProduct" [paginator]="true" [rows]="9">
                        <ng-template let-product pTemplate="listItem">
                            <div class="col-lg-4 col-md-6 col-sm-6 px-2">
                                <div class="featured__item">
                                    <div class="featured__item__pic set-bg" 
                                         [ngStyle]="{'background-image': 'url(data:image/jpeg;base64,'+ product.images[0].data+')'}">
                                        <ul class="featured__item__pic__hover">
                                            <li>
                                                <a href="javascript:void(0)" (click)="addToWishList(product)">
                                                    <fa-icon [icon]="heart"></fa-icon>
                                                </a>
                                            </li>
                                            <li>
                                                <a href="javascript:void(0)" routerLink="/product/{{product.id}}">
                                                    <fa-icon [icon]="retweet"></fa-icon>
                                                </a>
                                            </li>
                                            <li>
                                                <a href="javascript:void(0)" (click)="addToCart(product)">
                                                    <fa-icon [icon]="bag"></fa-icon>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                    <div class="featured__item__text">
                                        <h6><a href="javascript:void(0)">{{product.name}}</a></h6>
                                        <h5>{{product.price | currency:'VND':'symbol':'1.0-0':'vi'}}</h5>
                                    </div>
                                </div>
                            </div>
                        </ng-template>
                    </p-dataView>
                </div>
            </div>
        </div>
    </div>
</section>
